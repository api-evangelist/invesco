aid: invesco
name: Invesco
description: >-
  Invesco Ltd. (NYSE: IVZ) is a global independent investment management firm
  headquartered in Atlanta, Georgia, with approximately $1.95 trillion in
  assets under management. The firm operates a broad set of ETF, mutual fund,
  and institutional strategies, anchored by the Invesco QQQ Trust (QQQ)
  tracking the Nasdaq-100, the Invesco Solar ETF (TAN), and the Invesco
  BulletShares defined-maturity bond ETF suite. Invesco has recently extended
  its thematic ETF lineup into AI infrastructure and divested its remaining
  MassMutual stake. No public developer APIs are documented at this time;
  fund, ETF, and performance data are distributed through institutional
  market-data channels (Bloomberg, Refinitiv, NYSE) rather than a developer
  portal.
